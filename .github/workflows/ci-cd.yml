name: CI and deploy
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'feature/**', 'fix/**', 'refactor/**', 'style/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate deployment configuration helper
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:$REVISION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.name.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        env:
          IMAGE: ${{ steps.name.outputs.tag }}
        run: |
          docker run -d --name lit-smoke -e LIT_AI_PROVIDER=stub "$IMAGE"
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lit-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs lit-smoke
          exit 1
      - name: Publish verified image
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        id: publish
        env:
          IMAGE: ${{ steps.name.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$reference" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - name: Cleanup
        if: always()
        run: docker rm -f lit-smoke >/dev/null 2>&1 || true

  deploy:
    needs: image
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, lit-production]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure LIT module JavaScript MIME
        run: sudo -n python3 scripts/configure-report-mjs-nginx.py --apply
      - name: Deploy verified image on EC2
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          IMAGE_REF: ${{ needs.image.outputs.reference }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          test -s /opt/lit/app.env
          python3 scripts/configure-password-reset-url.py /opt/lit/app.env "$PRODUCTION_URL"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          install -m 0644 infra/compose.yml /opt/lit/compose.yml
          install -m 0750 scripts/deploy.sh /opt/lit/deploy.sh
          bash /opt/lit/deploy.sh "$IMAGE_REF"
      - name: Verify public HTTPS readiness
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --retry 3 --connect-timeout 5 --max-time 15 "$PRODUCTION_URL/actuator/health/readiness"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
