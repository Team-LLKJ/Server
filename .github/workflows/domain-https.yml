name: Configure LIT domain HTTPS
on:
  push:
    branches: [feature/automatic-ai-disclosure]
    paths: ['.github/workflows/domain-https.yml', 'scripts/configure-domain-https.py']
permissions:
  contents: read
concurrency:
  group: lit-domain-https
  cancel-in-progress: false
jobs:
  configure:
    runs-on: [self-hosted, linux, x64, lit-production]
    timeout-minutes: 10
    steps:
      - name: Inspect existing renewal runner
        run: |
          set -eu
          sudo -n systemctl cat lit-cert-renew.service lit-cert-renew.timer
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'
          df -h /opt
