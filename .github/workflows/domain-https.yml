name: Configure LIT domain HTTPS
on:
  push:
    branches: [feature/automatic-ai-disclosure]
    paths: ['.github/workflows/domain-https.yml', 'scripts/configure-domain-https.py']
permissions:
  contents: read
concurrency:
  group: lit-domain-https
  cancel-in-progress: false
jobs:
  configure:
    runs-on: [self-hosted, linux, x64, lit-production]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate domain configuration helper
        run: python3 -m unittest discover -s scripts -p 'test_domain_https.py'
      - name: Configure approved production domain
        run: sudo -n python3 scripts/configure-domain-https.py
      - name: Verify public domain
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 15 https://llkj.itslit.r-e.kr/actuator/health/readiness
          curl --fail --silent --show-error --max-time 15 --head https://llkj.itslit.r-e.kr/
