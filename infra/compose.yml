name: lit
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be a verified image reference}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      SERVER_PORT: '5174'
      DATABASE_URL: jdbc:h2:file:/app/data/lit
    ports:
      - '127.0.0.1:5174:5174'
    volumes:
      - lit-data:/app/data
    init: true
    stop_grace_period: 45s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  lit-data:
    name: lit-data
